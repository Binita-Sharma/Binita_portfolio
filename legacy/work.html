<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work | Binita</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="work-page-bg">
    
    <div id="navbar-container"></div>
    
    <main class="work-page">
        <section class="work-header section-padding text-center">
            <div class="container">
                <h1 class="work-title fade-up">My selected works</h1>
                <p class="work-subtitle fade-up" style="transition-delay: 0.1s;">
                    Discover my remarkable impressive projects with innovative<br>ideas. See for yourself exactly why I stand out different.
                </p>
            </div>
        </section>

        <section class="work-list-section">
            <div class="container">
                <div class="work-grid">
                    <!-- Project 1 -->
                    <div class="work-item-card fade-up">
                        <div class="browser-frame">
                            <div class="browser-dots">
                                <span></span><span></span><span></span>
                            </div>
                            <img src="assets/saathiconnect.png" alt="Project 1">
                        </div>
                        <div class="work-info">
                            <h3>SaathiConnect</h3>
                            <p>Civic issue reporting platform</p>
                        </div>
                    </div>
                    
                    <!-- Project 2 -->
                    <div class="work-item-card fade-up" style="transition-delay: 0.1s;">
                        <div class="browser-frame">
                            <div class="browser-dots">
                                <span></span><span></span><span></span>
                            </div>
                            <img src="assets/fakejob.png" alt="Project 2">
                        </div>
                        <div class="work-info">
                            <h3>Fake Job Detection</h3>
                            <p>ML-powered fraudulent job identification</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="script.js"></script>
</body>
</html>
